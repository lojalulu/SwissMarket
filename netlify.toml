# Caminho no repositório: netlify.toml  (na RAIZ, fora de qualquer pasta)
# SwissMarket Pulse — configuração de build do Netlify

[build]
  command = "npm run build"
  publish = ".next"

  # Pula o build se nada relevante para o SITE mudou (economiza minutos).
  # Regra do Netlify: "exit 0" = PULAR build | "exit 1" = FAZER build.
  # 1ª linha: no primeiro deploy os dois commits são iguais -> força o build.
  # scripts/ fica de fora de propósito: o scraper roda só no GitHub Actions;
  # quando ele atualiza os dados, a mudança em data/ já dispara o build.
  ignore = '''
    if [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ]; then exit 1; fi;
    git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- \
      app/ data/ components/ lib/ public/ \
      package.json next.config.js next.config.mjs tsconfig.json \
      tailwind.config.ts postcss.config.js netlify.toml
  '''

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Plugin oficial que faz o Next.js (incluindo a rota /api/search do "Buscar agora")
# rodar no Netlify como funções serverless.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Segurança básica e privacidade (uso pessoal: não indexar no Google)
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# A busca ao vivo nunca deve vir de cache: sempre consulta o Ricardo na hora
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
