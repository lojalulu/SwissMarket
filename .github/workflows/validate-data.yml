name: Validate Catalog & Data Integrity

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Validate JSON Format
        run: |
          node -e "
            const fs = require('fs');
            try {
              const data = JSON.parse(fs.readFileSync('./data/products.json', 'utf8'));
              if (!Array.isArray(data)) throw new Error('data/products.json precisa ser um Array');
              console.log('✅ Validação do JSON de dados concluída com sucesso. ' + data.length + ' produtos válidos.');
            } catch (err) {
              console.error('❌ Erro no formato do JSON:', err.message);
              process.exit(1);
            }
          "
